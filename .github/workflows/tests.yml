name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure tests (standalone)
        run: cmake -S Tests -B Build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build Build-tests --config Release

      - name: Run tests
        run: ctest --test-dir Build-tests --build-config Release --output-on-failure
